<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#285b4c"><title>听写 · IELTS</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head>
<body><main><header><a href="./" class="brand">听写 <small>IELTS / KEYBOARD PRACTICE</small></a><button id="settingsBtn">设置 · Esc</button></header><nav aria-label="练习模式"><button data-mode="main" class="active">主线</button><button data-mode="wrong">错词</button><button data-mode="random">随机</button></nav><section class="stats" id="stats"></section><progress id="coverage" value="0" max="1843" aria-label="已练词数"></progress><section class="practice"><div class="eyebrow" id="progress">准备加载词表</div><h1 id="title">听清楚，打出来。</h1><p id="subtitle">一次一个词，让拼写成为肌肉记忆。</p><button id="start" class="primary">开始练习 · Enter</button><div id="exercise" hidden><button id="replay" class="sound" aria-label="重听">▷ <span>重听 · Alt+R</span></button><div id="audioStatus" role="status"></div><p id="hint" hidden></p><form id="answerForm"><label for="answer" class="sr">输入听到的单词</label><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入你听到的词…" aria-describedby="feedback"><button id="submit" class="primary">提交 · Enter</button></form><div id="feedback" aria-live="polite"></div><div class="actions"><button id="previous">上一题</button><button id="skip">跳过 · Alt+→</button><button id="hintBtn">中文提示 · Alt+H</button></div></div><p id="message" role="status"></p></section><footer><kbd>Alt R</kbd> 重听　<kbd>Enter</kbd> 提交，再按下一题　<kbd>Alt →</kbd> 跳过<br><kbd>Backspace</kbd> 空框回退　<kbd>Alt 1 / 2 / 3</kbd> 语速　<kbd>Alt H</kbd> 提示　<kbd>Tab</kbd> 切换焦点</footer><details><summary>今日错词</summary><p id="wrongList">暂无</p></details><p id="offline" class="muted"></p></main>
<dialog id="settings"><form method="dialog"><h2>练习设置</h2><label>练习模式 <select id="modeSelect"><option value="main">主线 · 断点续练</option><option value="wrong">错词</option><option value="random">随机</option></select></label><label>语速 <select id="rate"><option value="0.75">0.75 ×</option><option value="1">1.0 ×</option><option value="1.25">1.25 ×</option></select></label><label><input id="showGloss" type="checkbox"> 默认显示中文释义</label><label><input id="strict" type="checkbox"> 严格判分（大小写、空格、标点原样匹配）</label><label><input id="autoplay" type="checkbox"> 自动播放</label><label><input id="autoNext" type="checkbox"> 判分后 600ms 自动下一题（默认关闭）</label><label><input id="spaceReplay" type="checkbox"> 输入框为空时空格重听（默认关闭）</label><button class="primary">保存并继续</button></form></dialog>
<script src="words.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
